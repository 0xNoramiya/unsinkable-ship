# Chaos VM: priority-0 OpenAI target uses the `openai-broken` integration
# (invalid key). The gateway tries it, fails, falls back to Anthropic for real.
name: chaos-openai-down
type: provider-account/virtual-model
collaborators:
  - role_id: provider-account-manager
    subject: user:rhaikal91@gmail.com
  - role_id: provider-account-access
    subject: team:everyone
integrations:
  - name: chaos-openai-down
    type: integration/model/virtual
    model_types: [chat]
    routing_config:
      type: priority-based-routing
      load_balance_targets:
        - target: openai-broken/gpt-4o
          priority: 0
          fallback_candidate: true
          fallback_status_codes: ["400", "401", "403", "404", "408", "429", "500", "502", "503", "504"]
          retry_config:
            attempts: 1
            delay: 50
        - target: anthropic/claude-sonnet-4-6
          priority: 1
          fallback_candidate: true
          fallback_status_codes: ["401", "403", "404", "408", "429", "500", "502", "503", "504"]
          retry_config:
            attempts: 2
            delay: 100
            on_status_codes: ["429", "500", "502", "503", "504"]
        - target: google-gemini/gemini-2.5-flash-lite
          priority: 2
          fallback_candidate: true
          retry_config:
            attempts: 1
            delay: 100
