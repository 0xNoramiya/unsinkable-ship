# Chaos VM: priority-0 OpenAI target is treated as if it's rate-limited.
# Uses on_status_codes including 429 with quick attempts; the broken integration
# returns 401 which is also in fallback_status_codes, so we model the user-visible
# experience of "primary throttled, fall over fast".
name: chaos-rate-limit
type: provider-account/virtual-model
collaborators:
  - role_id: provider-account-manager
    subject: user:rhaikal91@gmail.com
  - role_id: provider-account-access
    subject: team:everyone
integrations:
  - name: chaos-rate-limit
    type: integration/model/virtual
    model_types: [chat]
    routing_config:
      type: priority-based-routing
      load_balance_targets:
        - target: openai-broken/gpt-4o
          priority: 0
          fallback_candidate: true
          fallback_status_codes: ["400", "401", "403", "404", "408", "429", "500", "502", "503", "504"]
          retry_config:
            attempts: 3
            delay: 80
            on_status_codes: ["429", "500", "502", "503"]
        - target: anthropic/claude-sonnet-4-6
          priority: 1
          fallback_candidate: true
          fallback_status_codes: ["401", "403", "404", "408", "429", "500", "502", "503", "504"]
          retry_config:
            attempts: 2
            delay: 100
        - target: google-gemini/gemini-2.5-flash-lite
          priority: 2
          fallback_candidate: true
          retry_config:
            attempts: 1
            delay: 100
