<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: #0a0e14;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="90"
      data-width="1920"
      data-height="1080"
    >
      <!-- Sub-compositions: 10 scenes, hard-cut sequenced -->
      <div data-composition-id="scene-title"   data-composition-src="compositions/scene-1-title.html"   data-start="0"  data-duration="6"  data-track-index="1"></div>
      <div data-composition-id="scene-problem" data-composition-src="compositions/scene-2-problem.html" data-start="6"  data-duration="7"  data-track-index="1"></div>
      <div data-composition-id="scene-install" data-composition-src="compositions/scene-3-install.html" data-start="13" data-duration="9"  data-track-index="1"></div>
      <div data-composition-id="scene-code"    data-composition-src="compositions/scene-4-code.html"    data-start="22" data-duration="10" data-track-index="1"></div>
      <div data-composition-id="scene-happy"   data-composition-src="compositions/scene-5-happy.html"   data-start="32" data-duration="10" data-track-index="1"></div>
      <div data-composition-id="scene-break"   data-composition-src="compositions/scene-6-break.html"   data-start="42" data-duration="13" data-track-index="1"></div>
      <div data-composition-id="scene-cascade" data-composition-src="compositions/scene-7-cascade.html" data-start="55" data-duration="15" data-track-index="1"></div>
      <div data-composition-id="scene-mcp"     data-composition-src="compositions/scene-8-mcp.html"     data-start="70" data-duration="10" data-track-index="1"></div>
      <div data-composition-id="scene-stats"   data-composition-src="compositions/scene-9-stats.html"   data-start="80" data-duration="5"  data-track-index="1"></div>
      <div data-composition-id="scene-end"     data-composition-src="compositions/scene-10-end.html"    data-start="85" data-duration="5"  data-track-index="1"></div>

      <!-- Music: full 90s track, ducked under VO -->
      <audio id="music" data-start="0" data-duration="90" data-track-index="0"
             src="assets/music-trailer.mp3" data-volume="0.55"></audio>

      <!-- Narration: 4 short trailer lines (actual durations from ElevenLabs) -->
      <audio id="vo-1" data-start="7"    data-duration="1.62" data-track-index="2"
             src="assets/vo-1-problem.mp3"    data-volume="1.0"></audio>
      <audio id="vo-2" data-start="27"   data-duration="1.85" data-track-index="2"
             src="assets/vo-2-twolines.mp3"   data-volume="1.0"></audio>
      <audio id="vo-3" data-start="64"   data-duration="1.57" data-track-index="2"
             src="assets/vo-3-survive.mp3"    data-volume="1.0"></audio>
      <audio id="vo-4" data-start="86.5" data-duration="1.07" data-track-index="2"
             src="assets/vo-4-unsinkable.mp3" data-volume="1.0"></audio>

      <!-- SFX split across tracks 3-6 so simultaneous hits don't collide -->
      <!-- Track 3: button clicks -->
      <audio id="sfx-btn-install" data-start="17.0" data-duration="0.52" data-track-index="3"
             src="assets/sfx-button.mp3" data-volume="0.5"></audio>
      <audio id="sfx-btn-break"   data-start="44.7" data-duration="0.52" data-track-index="3"
             src="assets/sfx-button.mp3" data-volume="0.85"></audio>
      <audio id="sfx-btn-cascade" data-start="57.5" data-duration="0.52" data-track-index="3"
             src="assets/sfx-button.mp3" data-volume="0.85"></audio>

      <!-- Track 4: alerts (overlap with buttons by design) -->
      <audio id="sfx-alert-break"   data-start="44.9" data-duration="0.84" data-track-index="4"
             src="assets/sfx-alert.mp3" data-volume="0.9"></audio>
      <audio id="sfx-alert-cascade" data-start="57.7" data-duration="0.84" data-track-index="4"
             src="assets/sfx-alert.mp3" data-volume="1.0"></audio>

      <!-- Track 5: thumps -->
      <audio id="sfx-thump-break"   data-start="46.3" data-duration="0.52" data-track-index="5"
             src="assets/sfx-thump.mp3" data-volume="0.9"></audio>
      <audio id="sfx-thump-cascade" data-start="62.5" data-duration="0.52" data-track-index="5"
             src="assets/sfx-thump.mp3" data-volume="1.0"></audio>

      <!-- Track 6: whooshes + success -->
      <audio id="sfx-whoosh-code"  data-start="22.0" data-duration="0.73" data-track-index="6"
             src="assets/sfx-whoosh.mp3" data-volume="0.6"></audio>
      <audio id="sfx-whoosh-mcp"   data-start="70.0" data-duration="0.73" data-track-index="6"
             src="assets/sfx-whoosh.mp3" data-volume="0.7"></audio>
      <audio id="sfx-whoosh-stats" data-start="80.0" data-duration="0.73" data-track-index="6"
             src="assets/sfx-whoosh.mp3" data-volume="0.7"></audio>
      <audio id="sfx-success"      data-start="83.0" data-duration="1.23" data-track-index="6"
             src="assets/sfx-success.mp3" data-volume="0.9"></audio>
      <audio id="sfx-whoosh-end"   data-start="85.0" data-duration="0.73" data-track-index="6"
             src="assets/sfx-whoosh.mp3" data-volume="0.6"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
