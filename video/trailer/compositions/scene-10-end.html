<template id="scene-end-template">
  <div data-composition-id="scene-end" data-width="1920" data-height="1080">
    <div class="bg-fill"></div>
    <div class="glow"></div>
    <div class="grid"></div>

    <div class="center">
      <div class="ship">🚢</div>
      <div class="install"><span class="prompt">$</span>&nbsp;pip&nbsp;install&nbsp;unsinkable</div>
      <div class="link">github.com/0xNoramiya/unsinkable-ship</div>
      <div class="tagline">
        <span class="word">TWO</span>&nbsp;<span class="word">LINES</span>&nbsp;<span class="word">OF</span>&nbsp;<span class="word">CODE.</span>&nbsp;&nbsp;<span class="word amber">UNSINKABLE</span>&nbsp;<span class="word amber">AGENTS.</span>
      </div>
    </div>

    <style>
      [data-composition-id="scene-end"] {
        position: absolute; inset: 0; overflow: hidden;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        color: #d7e0ea;
      }
      [data-composition-id="scene-end"] .bg-fill { position: absolute; inset: 0; background: #0a0e14; }
      [data-composition-id="scene-end"] .glow {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(240,168,104,0.22), rgba(10,14,20,0) 60%);
      }
      [data-composition-id="scene-end"] .grid {
        position: absolute; inset: 0; opacity: 0.05;
        background-image: linear-gradient(rgba(215,224,234,1) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(215,224,234,1) 1px, transparent 1px);
        background-size: 96px 96px;
      }
      [data-composition-id="scene-end"] .center {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; padding: 0 160px; gap: 36px;
      }
      [data-composition-id="scene-end"] .ship {
        font-size: 140px; line-height: 1;
        filter: drop-shadow(0 0 60px rgba(240,168,104,0.5));
      }
      [data-composition-id="scene-end"] .install {
        font-size: 88px; font-weight: 700; letter-spacing: -0.04em;
        background: #10171f; padding: 28px 56px; border-radius: 16px;
        border: 1px solid #2a3b4f;
        box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(240,168,104,0.15);
      }
      [data-composition-id="scene-end"] .install .prompt { color: #f0a868; }
      [data-composition-id="scene-end"] .link {
        font-size: 30px; color: #7d8c9c; letter-spacing: 0.06em;
      }
      [data-composition-id="scene-end"] .tagline {
        font-size: 38px; letter-spacing: 0.16em; font-weight: 500;
        margin-top: 20px; text-align: center;
      }
      [data-composition-id="scene-end"] .word { display: inline-block; }
      [data-composition-id="scene-end"] .amber { color: #f0a868; font-weight: 800; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from('[data-composition-id="scene-end"] .ship',
        { scale: 0.7, opacity: 0, duration: 0.7, ease: "expo.out" }, 0.1);
      tl.from('[data-composition-id="scene-end"] .install',
        { y: 30, opacity: 0, duration: 0.55, ease: "expo.out" }, 0.5);
      tl.from('[data-composition-id="scene-end"] .link',
        { y: 14, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.95);
      tl.from('[data-composition-id="scene-end"] .word',
        { y: 18, opacity: 0, duration: 0.4, stagger: 0.08, ease: "power3.out" }, 1.4);

      tl.to('[data-composition-id="scene-end"] .glow',
        { opacity: 1.4, duration: 2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0);
      tl.to('[data-composition-id="scene-end"] .install',
        { boxShadow: "0 30px 80px rgba(0,0,0,0.6), 0 0 100px rgba(240,168,104,0.35)",
          duration: 1.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.5);

      window.__timelines["scene-end"] = tl;
    </script>
  </div>
</template>
