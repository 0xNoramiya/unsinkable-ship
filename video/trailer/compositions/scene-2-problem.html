<template id="scene-problem-template">
  <div data-composition-id="scene-problem" data-width="1920" data-height="1080">
    <div class="bg-fill"></div>
    <div class="glow"></div>

    <div class="center">
      <h2 class="line line-1">
        <span class="word">when</span>&nbsp;<span class="word">the</span>&nbsp;<span class="word">model</span>&nbsp;<span class="word">goes</span>&nbsp;<span class="word">down…</span>
      </h2>
      <h2 class="line line-2">
        <span class="word">your</span>&nbsp;<span class="word">agent</span>&nbsp;<span class="word crash">crashes.</span>
      </h2>
      <div class="cursor"></div>
    </div>

    <style>
      [data-composition-id="scene-problem"] {
        position: absolute; inset: 0; overflow: hidden;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        color: #d7e0ea;
      }
      [data-composition-id="scene-problem"] .bg-fill { position: absolute; inset: 0; background: #0a0e14; }
      [data-composition-id="scene-problem"] .glow {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 50% 70%, rgba(255,107,107,0.12), rgba(10,14,20,0) 65%);
      }
      [data-composition-id="scene-problem"] .center {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: flex-start; justify-content: center; padding: 0 200px;
        gap: 24px;
      }
      [data-composition-id="scene-problem"] .line {
        font-size: 96px; font-weight: 400; letter-spacing: -0.03em;
        line-height: 1.15;
      }
      [data-composition-id="scene-problem"] .line-1 { color: #7d8c9c; }
      [data-composition-id="scene-problem"] .line-2 { color: #d7e0ea; font-weight: 700; }
      [data-composition-id="scene-problem"] .word { display: inline-block; }
      [data-composition-id="scene-problem"] .crash { color: #ff6b6b; }
      [data-composition-id="scene-problem"] .cursor {
        width: 18px; height: 56px; background: #d7e0ea; margin-top: 12px;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from('[data-composition-id="scene-problem"] .line-1 .word',
        { opacity: 0, y: 12, duration: 0.4, stagger: 0.18, ease: "power2.out" }, 0.3);
      tl.from('[data-composition-id="scene-problem"] .line-2 .word',
        { opacity: 0, y: 12, duration: 0.4, stagger: 0.18, ease: "power2.out" }, 2.4);
      tl.from('[data-composition-id="scene-problem"] .crash',
        { color: "#d7e0ea", scale: 1, duration: 0 }, 3.5);
      tl.to('[data-composition-id="scene-problem"] .crash',
        { scale: 1.08, duration: 0.25, ease: "power3.out", yoyo: true, repeat: 1 }, 3.55);
      tl.fromTo('[data-composition-id="scene-problem"] .cursor',
        { opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.0);
      tl.to('[data-composition-id="scene-problem"] .cursor',
        { opacity: 0.1, duration: 0.5, repeat: 4, yoyo: true, ease: "steps(1)" }, 4.3);
      window.__timelines["scene-problem"] = tl;
    </script>
  </div>
</template>
