<template id="scene-install-template">
  <div data-composition-id="scene-install" data-width="1920" data-height="1080">
    <div class="bg-fill"></div>
    <div class="grid"></div>

    <div class="terminal">
      <div class="titlebar">
        <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
        <span class="path">~/projects/agent  —  zsh</span>
      </div>
      <div class="body">
        <div class="prompt-line">
          <span class="prompt">$</span>
          <span class="cmd"><span class="cmd-text"></span><span class="cursor">█</span></span>
        </div>
        <div class="output">
          <div class="out-line out-1">Collecting unsinkable</div>
          <div class="out-line out-2">  Downloading unsinkable-0.1.0-py3-none-any.whl (33 kB)</div>
          <div class="out-line out-3">Installing collected packages: unsinkable</div>
          <div class="out-line out-4 ok">Successfully installed unsinkable-0.1.0</div>
        </div>
      </div>
    </div>

    <div class="footer-meta">real package · pypi.org/project/unsinkable</div>

    <style>
      [data-composition-id="scene-install"] {
        position: absolute; inset: 0; overflow: hidden;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        color: #d7e0ea;
      }
      [data-composition-id="scene-install"] .bg-fill { position: absolute; inset: 0; background: #0a0e14; }
      [data-composition-id="scene-install"] .grid {
        position: absolute; inset: 0; opacity: 0.04;
        background-image: linear-gradient(rgba(215,224,234,1) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(215,224,234,1) 1px, transparent 1px);
        background-size: 96px 96px;
      }
      [data-composition-id="scene-install"] .terminal {
        position: absolute; top: 140px; left: 140px; right: 140px;
        background: #10171f; border: 1px solid #1c2530; border-radius: 12px;
        box-shadow: 0 30px 90px rgba(0,0,0,0.6);
        overflow: hidden;
      }
      [data-composition-id="scene-install"] .titlebar {
        height: 64px; display: flex; align-items: center; gap: 12px;
        padding: 0 24px; background: #0c1218; border-bottom: 1px solid #1c2530;
      }
      [data-composition-id="scene-install"] .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
      [data-composition-id="scene-install"] .dot.red    { background: #ff5f56; }
      [data-composition-id="scene-install"] .dot.yellow { background: #ffbd2e; }
      [data-composition-id="scene-install"] .dot.green  { background: #27c93f; }
      [data-composition-id="scene-install"] .path {
        margin-left: 22px; color: #7d8c9c; font-size: 20px;
      }
      [data-composition-id="scene-install"] .body { padding: 60px 60px 80px; font-size: 38px; line-height: 1.55; }
      [data-composition-id="scene-install"] .prompt-line { display: flex; align-items: baseline; gap: 22px; }
      [data-composition-id="scene-install"] .prompt { color: #f0a868; font-weight: 700; }
      [data-composition-id="scene-install"] .cmd-text { color: #d7e0ea; white-space: pre; }
      [data-composition-id="scene-install"] .cursor { color: #f0a868; display: inline-block; }
      [data-composition-id="scene-install"] .output { margin-top: 40px; color: #7d8c9c; font-size: 30px; line-height: 1.7; }
      [data-composition-id="scene-install"] .out-line { opacity: 0; }
      [data-composition-id="scene-install"] .out-line.ok { color: #7fe0a3; font-weight: 700; margin-top: 14px; }
      [data-composition-id="scene-install"] .footer-meta {
        position: absolute; bottom: 60px; left: 0; right: 0; text-align: center;
        font-size: 22px; color: #7d8c9c; letter-spacing: 0.2em;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const text = "pip install unsinkable";
      const cmdEl = document.querySelector('[data-composition-id="scene-install"] .cmd-text');

      tl.from('[data-composition-id="scene-install"] .terminal',
        { scale: 0.94, opacity: 0, y: 30, duration: 0.55, ease: "expo.out" }, 0.1);

      // typewriter via stepwise textContent changes
      text.split("").forEach((ch, i) => {
        tl.call(function (c) { return function () { cmdEl.textContent = text.slice(0, c + 1); }; }(i), null, 0.85 + i * 0.07);
      });

      // blink cursor
      tl.to('[data-composition-id="scene-install"] .cursor',
        { opacity: 0.1, duration: 0.5, repeat: 4, yoyo: true, ease: "steps(1)" }, 2.5);

      // output rolls in after enter
      tl.from('[data-composition-id="scene-install"] .out-1', { y: 14, duration: 0.35, ease: "power2.out" }, 4.0);
      tl.to  ('[data-composition-id="scene-install"] .out-1', { opacity: 1, duration: 0.2 }, 4.0);
      tl.from('[data-composition-id="scene-install"] .out-2', { y: 14, duration: 0.35, ease: "power2.out" }, 4.45);
      tl.to  ('[data-composition-id="scene-install"] .out-2', { opacity: 1, duration: 0.2 }, 4.45);
      tl.from('[data-composition-id="scene-install"] .out-3', { y: 14, duration: 0.35, ease: "power2.out" }, 5.05);
      tl.to  ('[data-composition-id="scene-install"] .out-3', { opacity: 1, duration: 0.2 }, 5.05);
      tl.from('[data-composition-id="scene-install"] .out-4', { y: 14, duration: 0.35, ease: "power2.out" }, 5.7);
      tl.to  ('[data-composition-id="scene-install"] .out-4', { opacity: 1, duration: 0.2 }, 5.7);

      tl.from('[data-composition-id="scene-install"] .footer-meta',
        { opacity: 0, y: 10, duration: 0.4, ease: "power2.out" }, 6.4);

      window.__timelines["scene-install"] = tl;
    </script>
  </div>
</template>
