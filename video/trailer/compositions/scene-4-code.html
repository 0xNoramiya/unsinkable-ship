<template id="scene-code-template">
  <div data-composition-id="scene-code" data-width="1920" data-height="1080">
    <div class="bg-fill"></div>
    <div class="grid"></div>

    <div class="editor">
      <div class="titlebar">
        <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
        <span class="tab">agent.py</span>
      </div>
      <div class="body">
        <div class="line line-1">
          <span class="ln">1</span>
          <span class="tok-keyword">from</span>&nbsp;<span class="tok-import"><span class="old">openai</span><span class="new">unsinkable</span></span>&nbsp;<span class="tok-keyword">import</span>&nbsp;<span class="tok-class">OpenAI</span>
        </div>
        <div class="line line-2">
          <span class="ln">2</span>
          <span class="tok-var">client</span>&nbsp;<span class="tok-op">=</span>&nbsp;<span class="tok-class">OpenAI</span><span class="tok-op">()</span><span class="comment">&nbsp;&nbsp;# via TF</span>
        </div>
      </div>
    </div>

    <div class="caption">TWO&nbsp;&nbsp;LINES&nbsp;&nbsp;OF&nbsp;&nbsp;CODE.</div>

    <style>
      [data-composition-id="scene-code"] {
        position: absolute; inset: 0; overflow: hidden;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        color: #d7e0ea;
      }
      [data-composition-id="scene-code"] .bg-fill { position: absolute; inset: 0; background: #0a0e14; }
      [data-composition-id="scene-code"] .grid {
        position: absolute; inset: 0; opacity: 0.04;
        background-image: linear-gradient(rgba(215,224,234,1) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(215,224,234,1) 1px, transparent 1px);
        background-size: 96px 96px;
      }
      [data-composition-id="scene-code"] .editor {
        position: absolute; top: 200px; left: 160px; right: 160px;
        background: #10171f; border: 1px solid #1c2530; border-radius: 12px;
        box-shadow: 0 30px 100px rgba(0,0,0,0.7);
        overflow: hidden;
      }
      [data-composition-id="scene-code"] .titlebar {
        height: 64px; display: flex; align-items: center; gap: 12px;
        padding: 0 24px; background: #0c1218; border-bottom: 1px solid #1c2530;
      }
      [data-composition-id="scene-code"] .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
      [data-composition-id="scene-code"] .dot.red    { background: #ff5f56; }
      [data-composition-id="scene-code"] .dot.yellow { background: #ffbd2e; }
      [data-composition-id="scene-code"] .dot.green  { background: #27c93f; }
      [data-composition-id="scene-code"] .tab {
        margin-left: 22px; color: #7d8c9c; font-size: 22px;
      }
      [data-composition-id="scene-code"] .body { padding: 80px 80px 100px; font-size: 48px; line-height: 1.6; white-space: nowrap; }
      [data-composition-id="scene-code"] .line { display: flex; align-items: baseline; gap: 28px; flex-wrap: nowrap; }
      [data-composition-id="scene-code"] .ln {
        color: #3a4858; width: 60px; text-align: right; font-size: 32px;
      }
      [data-composition-id="scene-code"] .tok-keyword { color: #f0a868; font-weight: 700; }
      [data-composition-id="scene-code"] .tok-class   { color: #80a8f0; }
      [data-composition-id="scene-code"] .tok-var     { color: #d7e0ea; }
      [data-composition-id="scene-code"] .tok-op      { color: #7d8c9c; }
      [data-composition-id="scene-code"] .tok-import  {
        position: relative; display: inline-block;
        width: 320px; height: 1.1em; vertical-align: baseline;
      }
      [data-composition-id="scene-code"] .old {
        position: absolute; top: 0; left: 0; width: 100%;
        color: #ff8a8a; text-decoration: line-through; text-decoration-color: rgba(255,138,138,0.7); text-decoration-thickness: 4px;
      }
      [data-composition-id="scene-code"] .new {
        position: absolute; top: 0; left: 0; width: 100%;
        color: #7fe0a3; opacity: 0;
        background: rgba(127,224,163,0.15); padding: 0 8px; border-radius: 6px;
        box-sizing: border-box;
      }
      [data-composition-id="scene-code"] .comment { color: #5a6878; opacity: 0; }
      [data-composition-id="scene-code"] .caption {
        position: absolute; bottom: 100px; left: 0; right: 0; text-align: center;
        font-size: 52px; letter-spacing: 0.42em; font-weight: 700; color: #f0a868;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from('[data-composition-id="scene-code"] .editor',
        { scale: 0.94, opacity: 0, y: 30, duration: 0.55, ease: "expo.out" }, 0.1);
      tl.from('[data-composition-id="scene-code"] .line-1',
        { opacity: 0, x: -20, duration: 0.5, ease: "power3.out" }, 0.6);
      tl.from('[data-composition-id="scene-code"] .line-2',
        { opacity: 0, x: -20, duration: 0.5, ease: "power3.out" }, 0.9);

      // strike the old import, swap to new
      tl.to('[data-composition-id="scene-code"] .old',
        { opacity: 0.35, duration: 0.4 }, 2.2);
      tl.fromTo('[data-composition-id="scene-code"] .new',
        { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 2.5);
      tl.to('[data-composition-id="scene-code"] .new',
        { boxShadow: "0 0 30px rgba(127,224,163,0.4)", duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.0);
      tl.to('[data-composition-id="scene-code"] .old',
        { opacity: 0, x: -8, duration: 0.3 }, 3.6);

      // reveal comment
      tl.to('[data-composition-id="scene-code"] .comment',
        { opacity: 1, duration: 0.5, ease: "power2.out" }, 4.2);

      // caption
      tl.from('[data-composition-id="scene-code"] .caption',
        { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" }, 5.0);
      tl.to('[data-composition-id="scene-code"] .caption',
        { letterSpacing: "0.5em", duration: 2.5, ease: "sine.inOut" }, 5.6);

      window.__timelines["scene-code"] = tl;
    </script>
  </div>
</template>
