<template id="scene-stats-template">
  <div data-composition-id="scene-stats" data-width="1920" data-height="1080">
    <div class="bg-fill"></div>
    <div class="glow"></div>

    <div class="frame">
      <div class="label">FINAL TALLY</div>
      <div class="grid-stats">
        <div class="stat">
          <div class="num" id="x-total">0</div>
          <div class="lbl">requests</div>
        </div>
        <div class="stat">
          <div class="num ok" id="x-ok">0</div>
          <div class="lbl">ok</div>
        </div>
        <div class="stat">
          <div class="num fb" id="x-fb">0</div>
          <div class="lbl">fallback</div>
        </div>
        <div class="stat">
          <div class="num err" id="x-err">0</div>
          <div class="lbl">errors</div>
        </div>
        <div class="stat">
          <div class="num" id="x-tokens">0</div>
          <div class="lbl">tokens</div>
        </div>
      </div>
      <div class="caption">
        <span class="big">14 REQUESTS</span>
        <span class="dot-sep">·</span>
        <span class="big highlight">0 USER ERRORS</span>
      </div>
    </div>

    <style>
      [data-composition-id="scene-stats"] {
        position: absolute; inset: 0; overflow: hidden;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        color: #d7e0ea;
      }
      [data-composition-id="scene-stats"] .bg-fill { position: absolute; inset: 0; background: #0a0e14; }
      [data-composition-id="scene-stats"] .glow {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(127,224,163,0.2), rgba(10,14,20,0) 60%);
      }
      [data-composition-id="scene-stats"] .frame {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; padding: 0 160px; gap: 60px;
      }
      [data-composition-id="scene-stats"] .label {
        font-size: 24px; letter-spacing: 0.5em; color: #7d8c9c; font-weight: 600;
      }
      [data-composition-id="scene-stats"] .grid-stats {
        display: grid; grid-template-columns: repeat(5, 1fr); gap: 48px;
        width: 100%; max-width: 1600px;
      }
      [data-composition-id="scene-stats"] .stat {
        background: #10171f; border: 1px solid #1c2530; border-radius: 12px;
        padding: 32px 24px; text-align: center;
      }
      [data-composition-id="scene-stats"] .num {
        font-size: 96px; font-weight: 800; font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      [data-composition-id="scene-stats"] .num.ok  { color: #7fe0a3; }
      [data-composition-id="scene-stats"] .num.fb  { color: #f0c060; }
      [data-composition-id="scene-stats"] .num.err { color: #ff8a8a; }
      [data-composition-id="scene-stats"] .lbl {
        color: #7d8c9c; font-size: 18px; text-transform: uppercase;
        letter-spacing: 0.18em; margin-top: 18px;
      }
      [data-composition-id="scene-stats"] .caption {
        display: flex; align-items: center; gap: 32px;
        font-size: 64px; font-weight: 700; letter-spacing: -0.02em;
      }
      [data-composition-id="scene-stats"] .big.highlight { color: #7fe0a3; }
      [data-composition-id="scene-stats"] .dot-sep { color: #3a4858; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from('[data-composition-id="scene-stats"] .label',
        { opacity: 0, y: -10, duration: 0.45, ease: "power2.out" }, 0.1);
      tl.from('[data-composition-id="scene-stats"] .stat',
        { y: 30, opacity: 0, scale: 0.9, duration: 0.5, stagger: 0.08, ease: "expo.out" }, 0.3);

      // count up
      const counters = [
        { id: "x-total", to: 14 }, { id: "x-ok", to: 11 },
        { id: "x-fb", to: 3 }, { id: "x-err", to: 0 },
        { id: "x-tokens", to: 1247 },
      ];
      counters.forEach((c, i) => {
        tl.to({ n: 0 }, {
          n: c.to, duration: 1.2, ease: "power2.out",
          onUpdate: function () {
            document.getElementById(c.id).textContent = Math.round(this.targets()[0].n);
          }
        }, 0.7 + i * 0.05);
      });

      tl.from('[data-composition-id="scene-stats"] .caption',
        { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" }, 2.4);
      tl.to('[data-composition-id="scene-stats"] .glow',
        { opacity: 1.4, duration: 1.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.5);

      window.__timelines["scene-stats"] = tl;
    </script>
  </div>
</template>
