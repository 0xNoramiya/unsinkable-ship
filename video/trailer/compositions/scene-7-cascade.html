<template id="scene-cascade-template">
  <div data-composition-id="scene-cascade" data-width="1920" data-height="1080">
    <div class="bg-fill"></div>
    <div class="grid"></div>

    <div class="dash">
      <div class="header">
        <div class="logo">🚢 UNSINKABLE — LIVE RESILIENCE</div>
        <div class="status"><span class="dot ok"></span>connected</div>
      </div>

      <div id="banner" class="banner">⚠ CHAOS ACTIVE — cascade :: resilient-chat → chaos-cascade</div>

      <div class="stats">
        <div class="stat"><div class="num" id="c-total">2</div><div class="lbl">Requests</div></div>
        <div class="stat"><div class="num ok" id="c-ok">1</div><div class="lbl">OK</div></div>
        <div class="stat"><div class="num fb" id="c-fb">1</div><div class="lbl">Fallback</div></div>
        <div class="stat"><div class="num err">0</div><div class="lbl">Error</div></div>
      </div>

      <div class="controls">
        <button class="btn danger">Break OpenAI</button>
        <button class="btn danger">Break Anthropic</button>
        <button id="btn-cascade" class="btn danger highlight">Cascade (both)</button>
        <button class="btn danger">Break MCP primary</button>
        <button class="btn warn">Brownout +3s</button>
        <button class="btn ok">Clear chaos</button>
      </div>

      <!-- fallback-chain visualization -->
      <div id="chain" class="chain">
        <div id="chain-1" class="hop hop-broken">
          <div class="hop-name">openai-broken/gpt-4o</div>
          <div class="hop-state">✕ FAIL</div>
        </div>
        <div class="arrow">→</div>
        <div id="chain-2" class="hop hop-broken">
          <div class="hop-name">anthropic-broken/claude</div>
          <div class="hop-state">✕ FAIL</div>
        </div>
        <div class="arrow">→</div>
        <div id="chain-3" class="hop hop-ok">
          <div class="hop-name">google-gemini/flash-lite</div>
          <div class="hop-state">✓ ANSWERS</div>
        </div>
      </div>

      <div class="table">
        <div class="thead">
          <span>time</span><span>requested</span><span>resolved</span><span>status</span><span>latency</span>
        </div>
        <div class="row row-new fb">
          <span class="t">21:43:14</span>
          <span><span class="badge dim">resilient-chat/resilient-chat</span> <span class="pill chaos">CHAOS</span></span>
          <span><span class="badge gemini">gemini-2.5-flash-lite</span></span>
          <span><span class="pill fb">FALLBACK</span> <span class="dim">200</span></span>
          <span class="dim">1742ms</span>
        </div>
      </div>
    </div>

    <div id="cursor" class="cursor-mock">
      <svg viewBox="0 0 24 24" width="36" height="36"><path d="M2 2 L2 16 L6 12 L9 19 L12 18 L9 11 L15 11 Z" fill="#fff" stroke="#000" stroke-width="1"/></svg>
    </div>

    <style>
      [data-composition-id="scene-cascade"] {
        position: absolute; inset: 0; overflow: hidden;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        color: #d7e0ea; background: #0a0e14;
      }
      [data-composition-id="scene-cascade"] .bg-fill { position: absolute; inset: 0; background: #0a0e14; }
      [data-composition-id="scene-cascade"] .grid {
        position: absolute; inset: 0; opacity: 0.04;
        background-image: linear-gradient(rgba(215,224,234,1) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(215,224,234,1) 1px, transparent 1px);
        background-size: 96px 96px;
      }
      [data-composition-id="scene-cascade"] .dash {
        position: absolute; top: 80px; left: 100px; right: 100px; bottom: 80px;
        background: #10171f; border: 1px solid #1c2530; border-radius: 14px;
        padding: 36px 40px; display: flex; flex-direction: column; gap: 18px;
        box-shadow: 0 30px 100px rgba(0,0,0,0.6);
      }
      [data-composition-id="scene-cascade"] .header {
        display: flex; justify-content: space-between; align-items: center;
        padding-bottom: 16px; border-bottom: 1px solid #1c2530;
      }
      [data-composition-id="scene-cascade"] .logo { font-size: 28px; font-weight: 700; letter-spacing: 0.08em; }
      [data-composition-id="scene-cascade"] .status { font-size: 18px; color: #7d8c9c; display: flex; align-items: center; gap: 10px; }
      [data-composition-id="scene-cascade"] .dot { width: 10px; height: 10px; border-radius: 50%; background: #7fe0a3; box-shadow: 0 0 12px rgba(127,224,163,0.6); }
      [data-composition-id="scene-cascade"] .banner {
        background: #3a1e1e; color: #ffd0d0; border: 1px solid #5a2828;
        padding: 16px 22px; border-radius: 8px; font-size: 22px; font-weight: 500;
        opacity: 0;
      }
      [data-composition-id="scene-cascade"] .stats { display: flex; gap: 14px; }
      [data-composition-id="scene-cascade"] .stat {
        background: #0a0e14; border: 1px solid #1c2530; border-radius: 8px;
        padding: 14px 22px; min-width: 140px;
      }
      [data-composition-id="scene-cascade"] .num { font-size: 36px; font-weight: 600; font-variant-numeric: tabular-nums; }
      [data-composition-id="scene-cascade"] .num.ok { color: #7fe0a3; }
      [data-composition-id="scene-cascade"] .num.fb { color: #f0c060; }
      [data-composition-id="scene-cascade"] .num.err { color: #ff8a8a; }
      [data-composition-id="scene-cascade"] .lbl {
        color: #7d8c9c; font-size: 14px; text-transform: uppercase;
        letter-spacing: 0.08em; margin-top: 4px;
      }
      [data-composition-id="scene-cascade"] .controls { display: flex; gap: 12px; flex-wrap: wrap; }
      [data-composition-id="scene-cascade"] .btn {
        background: #1a2733; color: #d7e0ea; border: 1px solid #2a3b4f;
        padding: 11px 20px; border-radius: 6px; font: inherit; font-size: 18px;
        cursor: default;
      }
      [data-composition-id="scene-cascade"] .btn.danger { background: #3a1e1e; border-color: #5a2828; color: #ffb0b0; }
      [data-composition-id="scene-cascade"] .btn.warn   { background: #3a311e; border-color: #5a4828; color: #ffd070; }
      [data-composition-id="scene-cascade"] .btn.ok     { background: #1e3a2a; border-color: #285a38; color: #9fe0a3; }
      [data-composition-id="scene-cascade"] .chain {
        display: flex; align-items: stretch; gap: 18px; opacity: 0;
        padding: 22px; background: #0a0e14; border: 1px solid #1c2530; border-radius: 10px;
      }
      [data-composition-id="scene-cascade"] .hop {
        flex: 1; padding: 18px 22px; border-radius: 8px;
        background: #10171f; border: 1px solid #1c2530;
        display: flex; flex-direction: column; gap: 6px;
      }
      [data-composition-id="scene-cascade"] .hop-broken { border-color: #5a2828; }
      [data-composition-id="scene-cascade"] .hop-ok { border-color: #285a38; box-shadow: 0 0 24px rgba(127,224,163,0.18); }
      [data-composition-id="scene-cascade"] .hop-name { font-size: 22px; color: #d7e0ea; }
      [data-composition-id="scene-cascade"] .hop-state { font-size: 18px; font-weight: 700; }
      [data-composition-id="scene-cascade"] .hop-broken .hop-state { color: #ff8a8a; }
      [data-composition-id="scene-cascade"] .hop-ok .hop-state { color: #7fe0a3; }
      [data-composition-id="scene-cascade"] .arrow { color: #7d8c9c; font-size: 32px; align-self: center; }
      [data-composition-id="scene-cascade"] .table {
        background: #0a0e14; border: 1px solid #1c2530; border-radius: 8px;
        padding: 0; min-height: 120px; overflow: hidden;
      }
      [data-composition-id="scene-cascade"] .thead {
        display: grid; grid-template-columns: 130px 1fr 1fr 240px 130px;
        padding: 12px 22px; color: #7d8c9c; font-size: 14px;
        text-transform: uppercase; letter-spacing: 0.06em;
        border-bottom: 1px solid #1c2530;
      }
      [data-composition-id="scene-cascade"] .row {
        display: grid; grid-template-columns: 130px 1fr 1fr 240px 130px;
        padding: 18px 22px; align-items: center; font-size: 22px;
      }
      [data-composition-id="scene-cascade"] .row.fb { background: rgba(240,192,96,0.08); }
      [data-composition-id="scene-cascade"] .row .t { color: #7d8c9c; font-size: 16px; }
      [data-composition-id="scene-cascade"] .badge {
        display: inline-block; padding: 4px 12px; border-radius: 4px;
        font-size: 18px; font-weight: 500; margin-right: 6px;
      }
      [data-composition-id="scene-cascade"] .badge.gemini { background: #14253a; color: #80a8f0; }
      [data-composition-id="scene-cascade"] .badge.dim    { color: #7d8c9c; }
      [data-composition-id="scene-cascade"] .pill {
        display: inline-block; padding: 3px 12px; border-radius: 12px;
        font-size: 14px; font-weight: 600;
      }
      [data-composition-id="scene-cascade"] .pill.fb    { background: #3a311e; color: #f0c060; }
      [data-composition-id="scene-cascade"] .pill.chaos { background: #3a1e3a; color: #f0a0f0; }
      [data-composition-id="scene-cascade"] .dim { color: #7d8c9c; font-size: 16px; }
      [data-composition-id="scene-cascade"] .cursor-mock {
        position: absolute; left: 1700px; top: 800px; opacity: 0;
        filter: drop-shadow(0 0 8px rgba(0,0,0,0.8));
        pointer-events: none;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.set('[data-composition-id="scene-cascade"] .row-new', { opacity: 0 }, 0);
      tl.set('[data-composition-id="scene-cascade"] .hop-ok', { opacity: 0 }, 0);
      tl.set('[data-composition-id="scene-cascade"] .hop-broken', { opacity: 0 }, 0);

      tl.from('[data-composition-id="scene-cascade"] .dash',
        { opacity: 0, scale: 0.98, duration: 0.35, ease: "power2.out" }, 0);

      // cursor to cascade button (3rd button, ~520px)
      tl.fromTo('[data-composition-id="scene-cascade"] #cursor',
        { left: 1700, top: 800, opacity: 0 },
        { opacity: 1, duration: 0.25 }, 0.4);
      tl.to('[data-composition-id="scene-cascade"] #cursor',
        { left: 580, top: 470, duration: 1.4, ease: "power2.inOut" }, 0.7);

      // click cascade
      tl.to('[data-composition-id="scene-cascade"] #btn-cascade',
        { scale: 0.92, duration: 0.1, ease: "power2.in" }, 2.2);
      tl.to('[data-composition-id="scene-cascade"] #btn-cascade',
        { scale: 1, boxShadow: "0 0 50px 12px rgba(255,107,107,0.6)", duration: 0.35, ease: "power3.out" }, 2.3);
      tl.to('[data-composition-id="scene-cascade"] #btn-cascade',
        { boxShadow: "0 0 0 0 rgba(255,107,107,0)", duration: 1.4, ease: "power2.out" }, 2.65);

      // banner slides down
      tl.fromTo('[data-composition-id="scene-cascade"] #banner',
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 2.55);

      // cursor retreats
      tl.to('[data-composition-id="scene-cascade"] #cursor',
        { left: 1700, top: 900, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 3.0);

      // chain panel slides in
      tl.fromTo('[data-composition-id="scene-cascade"] .chain',
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.5);

      // hop 1 appears, fails
      tl.fromTo('[data-composition-id="scene-cascade"] #chain-1',
        { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.0);
      tl.to('[data-composition-id="scene-cascade"] #chain-1',
        { boxShadow: "inset 0 0 40px rgba(255,107,107,0.5)", duration: 0.4, ease: "power2.out" }, 4.3);

      // hop 2 appears, fails
      tl.fromTo('[data-composition-id="scene-cascade"] #chain-2',
        { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.2);
      tl.to('[data-composition-id="scene-cascade"] #chain-2',
        { boxShadow: "inset 0 0 40px rgba(255,107,107,0.5)", duration: 0.4, ease: "power2.out" }, 5.5);

      // hop 3 — Gemini answers, with triumphant glow
      tl.fromTo('[data-composition-id="scene-cascade"] #chain-3',
        { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 6.4);
      tl.to('[data-composition-id="scene-cascade"] #chain-3',
        { boxShadow: "0 0 60px rgba(127,224,163,0.5)", duration: 0.7, ease: "power2.out" }, 6.8);

      // row lands
      tl.to('[data-composition-id="scene-cascade"] .row-new',
        { opacity: 1, duration: 0.45, ease: "power3.out" }, 7.5);
      tl.fromTo('[data-composition-id="scene-cascade"] .row-new',
        { y: -18 }, { y: 0, duration: 0.4, ease: "expo.out" }, 7.5);

      // counter ticks
      tl.to({n: 2}, {
        n: 3, duration: 0.3, ease: "power2.out",
        onUpdate: function () { document.getElementById("c-total").textContent = Math.round(this.targets()[0].n); }
      }, 7.9);
      tl.to({n: 1}, {
        n: 2, duration: 0.3, ease: "power2.out",
        onUpdate: function () { document.getElementById("c-fb").textContent = Math.round(this.targets()[0].n); }
      }, 7.9);

      // hold the dramatic glow on hop-3 + ambient pulse
      tl.to('[data-composition-id="scene-cascade"] #chain-3',
        { boxShadow: "0 0 90px rgba(127,224,163,0.7)", duration: 1.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, 8.5);

      window.__timelines["scene-cascade"] = tl;
    </script>
  </div>
</template>
