[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unsinkable"
version = "0.1.0"
description = "Drop-in resilience layer for LLM apps. Two lines of code, plus a chaos CLI and live dashboard, all powered by TrueFoundry's AI Gateway."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Unsinkable Ship" }]
dependencies = [
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
    "jinja2>=3.1.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5.0"]

[project.scripts]
unsinkable = "unsinkable.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unsinkable"]

[tool.ruff]
line-length = 100
target-version = "py310"
